# Mirrors how GitHub Pages serves this site, so the container and production
# resolve the same URLs.
#
# nginx does not inherit `add_header` into a block that declares its own, so
# the security headers are repeated in every location rather than set once at
# server level -- without that, assets came back with caching directives and no
# nosniff at all.
server {
    listen 4000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # Pages serves /a/b from /a/b.html when there is no /a/b/index.html. Real
    # URLs depend on it -- /publication/2024-supply-chain-sustainability and
    # /resume-json among them -- so try the sibling file before giving up.
    # HTML revalidates every time so a deploy is visible immediately.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Assets carry a ?v= cache-buster, so they can be held for a week. One
    # Cache-Control only: `expires` emits its own and the pair disagreed.
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
