
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
    	<title>Namit Shrivastava — Talk locations</title>

    	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.css" />
    	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.js"></script>
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<link rel="stylesheet" href="leaflet_dist/screen.css" />

    	<link rel="stylesheet" href="leaflet_dist/MarkerCluster.css" />
    	<link rel="stylesheet" href="leaflet_dist/MarkerCluster.Default.css" />
    	<script src="leaflet_dist/leaflet.markercluster-src.js"></script>
    	<script src="org-locations.js"></script>

    </head>
    <body>

    	<div id="map" role="region" aria-label="Map of talk locations"></div>
    	<p id="map-help">Select a marker to read about a talk, or a cluster to zoom in. <a href="/talks/" target="_top">View all talks as a list</a>.</p>
      <noscript><p>The map needs JavaScript. Use the talks list to explore each presentation.</p></noscript>
    	<script type="text/javascript">
        if (window.L && L.markerClusterGroup && Array.isArray(window.addressPoints)) {
    		var tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
              maxZoom: 18,
              attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
                    }),
    			latlng = L.latLng(30, 10);
    		var map = L.map('map', {center: latlng, zoom: 0.7, layers: [tiles]});
    		var markers = L.markerClusterGroup({
    			showCoverageOnHover: false,
    			maxClusterRadius: 80
    			});
    		for (var i = 0; i < addressPoints.length; i++) {
    			var a = addressPoints[i];
    			var title = a[0];
    			var marker = L.marker(new L.LatLng(a[1], a[2]), { title: 'Talk location', alt: 'Talk location — select for presentation details' });
    			marker.bindPopup(title);
    			markers.addLayer(marker);
    		}
    		map.addLayer(markers);
    		map.zoomIn();
        } else {
          document.getElementById('map').textContent = 'The interactive map is temporarily unavailable. All presentations are available in the talks list below.';
        }
    	</script>
    </body>
    </html>
