  <script>
    /* Pre-paint theme init — runs before the stylesheet paints so there is no
       flash when a visitor prefers (or previously chose) the light theme.
       Shares the "theme" localStorage key with the classic Jekyll view.
       `data-js` gates the reveal-on-scroll transitions: without JS the content
       must render already visible rather than stuck at opacity 0. */
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      }
      var color = document.querySelector('meta[name="theme-color"]');
      if (color) color.content = document.documentElement.getAttribute("data-theme") === "light" ? "#f4f4f1" : "#0b0c11";
      document.documentElement.setAttribute("data-js", "1");
    })();
  </script>
