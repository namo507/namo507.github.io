  <script>
    /* Pre-paint theme init — runs before the stylesheet paints so there is no
       flash when a visitor prefers (or previously chose) the light theme.
       Shares the "theme" localStorage key with the classic Jekyll view. */
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) { /* storage unavailable — keep dark default */ }
    })();
  </script>
