name: Site Health (daily doctor)

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

concurrency:
  group: repo-autocommit
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  doctor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-site
        with:
          visual: 'true'
      - name: Apply bounded stylesheet repairs
        run: python scripts/site_doctor/doctor.py --only contrast alignment --no-visual
      - name: Rebuild the repaired site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Verify rendering, accessibility, and motion
        run: node scripts/site_doctor/visual_audit.mjs
      - name: Validate repaired data, styles, and links
        if: success() || failure()
        run: python scripts/site_doctor/doctor.py --check --strict --external-links
      - name: Commit only verified stylesheet repairs
        run: |
          bash scripts/ci/commit-generated.sh 'chore(site-doctor): repair verified contrast and spacing' assets/cosmic/styles.css
      - name: Monitor workflows with one recovery attempt per failed run
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          SITE_DOCTOR_REDISPATCH: '1'
        run: python scripts/site_doctor/doctor.py --only workflow --strict --no-visual --report-dir scripts/site_doctor/reports/workflows
      - name: Check the public website
        if: success() || failure()
        run: python scripts/ci/check_http.py https://namo507.github.io
      - name: Upload health reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-doctor-report
          path: scripts/site_doctor/reports/
          if-no-files-found: warn
          retention-days: 14
