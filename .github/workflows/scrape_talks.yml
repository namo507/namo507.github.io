name: Scrape Talk Locations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_talks/**'
      - 'scripts/scrape_talks.py'
      - '.github/workflows/scrape_talks.yml'

concurrency:
  group: repo-autocommit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-site
      - name: Generate deterministic talk locations
        run: python scripts/scrape_talks.py
      - name: Validate and commit map data
        run: |
          bash scripts/ci/commit-generated.sh 'chore: refresh talk locations' talkmap/org-locations.js talkmap/org-locations.json
