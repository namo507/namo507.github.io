name: Sync LinkedIn Profile

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 */5 * *'

concurrency:
  group: repo-autocommit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-site
      - name: Refresh LinkedIn data while preserving the validated snapshot
        run: python scripts/sync_linkedin_content.py --verbose
      - name: Validate and commit changed content
        run: |
          bash scripts/ci/commit-generated.sh 'chore: refresh LinkedIn portfolio content' \
            _data/linkedin_profile.yml _data/linkedin_experience.yml \
            _data/linkedin_featured.yml _data/linkedin_updates.yml \
            _data/linkedin_sync_meta.yml _data/linkedin_snapshot.json \
            assets/cosmic/linkedin.generated.js
