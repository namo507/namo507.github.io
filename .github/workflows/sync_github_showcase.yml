name: Sync GitHub Showcase

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - scripts/sync_github_showcase.py
      - scripts/github_showcase_source.json
      - .github/workflows/sync_github_showcase.yml

concurrency:
  group: repo-autocommit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-site
      - name: Refresh generated GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_github_showcase.py
      - name: Validate and commit changed content
        run: |
          bash scripts/ci/commit-generated.sh 'chore: refresh GitHub showcase' _data/github.yml
