name: Set up the portfolio toolchain
description: Install locked site dependencies and compile the local frontend bundle.
inputs:
  visual:
    description: Install Chromium and the rendered accessibility audit dependencies.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          scripts/site_doctor/requirements.txt
          scripts/requirements-linkedin-sync.txt
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: |
          package-lock.json
          scripts/site_doctor/package-lock.json
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler: '2.4.19'
        bundler-cache: true
    - name: Install Python dependencies
      shell: bash
      run: python -m pip install -r scripts/site_doctor/requirements.txt -r scripts/requirements-linkedin-sync.txt
    - name: Build local frontend assets
      shell: bash
      run: |
        npm ci --no-audit --no-fund
        npm run build:cosmic
    - name: Install rendered audit dependencies
      if: inputs.visual == 'true'
      shell: bash
      run: |
        npm ci --prefix scripts/site_doctor --no-audit --no-fund
        cd scripts/site_doctor
        npx playwright install --with-deps chromium
