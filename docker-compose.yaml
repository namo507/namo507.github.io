services:
  jekyll-site:
    image: namo507-portfolio:local
    build: .
    init: true
    restart: unless-stopped
    volumes:
      - .:/usr/src/app
      - site-build:/usr/src/app/_site
      - sass-cache:/usr/src/app/.sass-cache
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      JEKYLL_ENV: development
    stop_grace_period: 20s

volumes:
  site-build:
  sass-cache:
